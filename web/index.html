<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WriteDown</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="../wasm/wasm_exec.js"></script>
    <script src="./src/wasm_loader.js"></script>
</head>
<body>
    <div class="app">
        <header class="toolbar">
            <h1>WriteDown - Editor</h1>
            <div class="controls">
                <select id="language-select" name="language">
                    <option value="HTML" selected>HTML</option>
                    <option value="Markdown">Markdown</option>
                    <option value="Dobbm Markup">Dobbm Markup</option>
                    <option value="Plain">Plain text</option>
                </select>
            </div>
        </header>

        <main class="editor-layout">
            <textarea name="HTML code" id="code" aria-label="Code editor"></textarea>
            <iframe id="htmlresult" title="Rendered output" sandbox>Your code will be displayed here</iframe>
        </main>
    </div>

    <script src="src/transformer.js" type="module"></script>
</body>
</html>
